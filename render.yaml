services:
  - type: web
    name: murade-contabil
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: MURADE_INTEGRATION_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: MURADE_BACKUP_MASTER_KEY
        sync: false
      # Backup completo do banco para fora do Render (mesmas variáveis nos três sistemas; sem elas o backup fica desligado).
      - key: MURADE_BACKUP_CHAVE
        sync: false
      - key: MURADE_BACKUP_S3_ENDPOINT
        sync: false
      - key: MURADE_BACKUP_S3_BUCKET
        sync: false
      - key: MURADE_BACKUP_S3_ACCESS_KEY
        sync: false
      - key: MURADE_BACKUP_S3_SECRET_KEY
        sync: false
      - key: MURADE_BACKUP_S3_REGION
        sync: false
