services:
  - type: web
    name: murade-contabil
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # Publicação no meio da migração pelo backup: até 120 s (SIGTERM → SIGKILL) para terminar ou desfazer a empresa da vez e
    # devolver "pausado" à tela, que pede de novo ao servidor novo. MURADE_PRAZO_DESLIGAR_S diz ao código o mesmo prazo.
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: MURADE_INTEGRATION_TOKEN
        sync: false
      - key: MURADE_PRAZO_DESLIGAR_S
        value: "120"
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: MURADE_BACKUP_MASTER_KEY
        sync: false
      # Backup completo do banco para fora do Render (mesmas variáveis nos três sistemas; sem elas o backup fica desligado).
      - key: MURADE_BACKUP_CHAVE
        sync: false
      - key: MURADE_BACKUP_S3_ENDPOINT
        sync: false
      - key: MURADE_BACKUP_S3_BUCKET
        sync: false
      - key: MURADE_BACKUP_S3_ACCESS_KEY
        sync: false
      - key: MURADE_BACKUP_S3_SECRET_KEY
        sync: false
      - key: MURADE_BACKUP_S3_REGION
        sync: false
